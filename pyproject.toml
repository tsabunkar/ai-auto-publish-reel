[project]
name = "ai-content-automation-platform"
version = "1.0.0"
description = "AI Content Automation Platform — generates AI videos and publishes to social media"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
orchestrator = [
    "boto3>=1.35",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-json-logger",
    "feedparser>=6.0",
    "tenacity>=8.0",
]
publisher = [
    "boto3>=1.35",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-json-logger",
    "tenacity>=8.0",
    "requests>=2.31",
]
macbook = [
    "boto3>=1.35",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-json-logger",
    "tenacity>=8.0",
    "awsiotsdk>=1.20",
]
kali = [
    "pydantic>=2.0",
    "tenacity>=8.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "moto>=5.0",
    "types-requests",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"kali/**/*.py" = []

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
